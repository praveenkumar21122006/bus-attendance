services:
  - type: web
    name: bus-attendance
    runtime: docker
    plan: starter
    healthCheckPath: /
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATA_DIR
        value: /var/lib/bus-attendance
    disk:
      name: bus-attendance-data
      mountPath: /var/lib/bus-attendance
      sizeGB: 10
